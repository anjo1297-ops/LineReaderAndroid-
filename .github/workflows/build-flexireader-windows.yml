name: Build FlexiReader Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - flexireader-windows
    paths:
      - 'windows/FlexiReader/**'
      - '.github/workflows/build-flexireader-windows.yml'
  pull_request:
    paths:
      - 'windows/FlexiReader/**'
      - '.github/workflows/build-flexireader-windows.yml'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore windows/FlexiReader/FlexiReader.csproj

      - name: Publish self-contained Windows build
        run: dotnet publish windows/FlexiReader/FlexiReader.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/FlexiReader-Windows-0.1.3

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: FlexiReader-Windows-0.1.3
          path: artifacts/FlexiReader-Windows-0.1.3/**
          if-no-files-found: error
          retention-days: 30
